<html lang="tr"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Belge Detayları</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
    <style>
      body {
        background-color: #f0f2f5;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      .main-card {
        margin-top: 30px;
        margin-bottom: 30px;
        padding: 0;
        background-color: white;
        border-radius: 15px;
        box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
      }
      .card-header {
        background: linear-gradient(135deg, #0061f2 0%, #00a7e1 100%);
        color: white;
        padding: 20px;
        border-radius: 15px 15px 0 0;
      }
      .card-body {
        padding: 30px;
      }
      .detail-row {
        margin-bottom: 15px;
        padding: 15px;
        border: none;
        background-color: #f8f9fa;
        border-radius: 10px;
      }
      .detail-row:hover {
        background-color: #f8f9fa;
        transform: none;
      }
      .detail-row strong {
        color: #495057;
        font-weight: 600;
        min-width: 200px;
        display: inline-block;
      }
      .badge {
        padding: 8px 12px;
        border-radius: 6px;
        font-weight: 500;
      }
      .badge-success {
        background-color: #00b74a;
      }
      .badge-warning {
        background-color: #ffa900;
      }
      .btn-primary {
        padding: 10px 25px;
        border-radius: 8px;
        background: linear-gradient(135deg, #0061f2 0%, #00a7e1 100%);
        transition: all 0.3s ease;
        font-weight: 500;
        box-shadow: 0 2px 10px rgba(0, 123, 255, 0.2);
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
      }
      .vehicle-section {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 2px solid #e9ecef;
      }
      .map-section {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 2px solid #e9ecef;
      }
      #route-map {
        width: 100%;
        height: 360px;
        border-radius: 12px;
        border: 1px solid #e9ecef;
        overflow: hidden;
      }
      .table {
        margin-bottom: 0;
      }
      .thead-light th {
        background-color: #f8f9fa;
        border-bottom: 2px solid #dee2e6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="main-card">
        <div class="card-header text-center">
          <h2>Belge Detayları</h2>
        </div>
        <div class="card-body">
          <div class="detail-row">
            <strong>Belge No:</strong> <span>273713001</span>
          </div>
          <div class="detail-row">
            <strong>Taşıyıcı Firma:</strong>
            <span>ÖZBEKLER İNŞAAT HAFRİYAT NAKLİYAT GIDA TEKSTİL VE SAN. TİC LİMİTED ŞİRKETİ</span>
          </div>
          <div class="detail-row">
            <strong>Durum:</strong>
            <span class="badge badge-success">
              Aktif
            </span>
          </div>

          

          <div class="vehicle-section">
            <h4 class="mb-4">Araç Bilgileri</h4>
            <div class="mb-3">
              <input type="text" id="plakaArama" class="form-control" placeholder="Plaka ara..." style="max-width: 200px">
            </div>
            <table class="table table-bordered">
              <thead class="thead-light">
                <tr>
                  <th>Sıra No</th>
                  <th>Plaka</th>
                  <th>Eklenme Tarihi</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>1</td>
                  <td>34AFA909</td>
                  <td>25 Temmuz 2026 15:48</td>
                </tr>                
              </tbody>
            </table>
          </div>
        </div>
        <div class="text-end mt-4">
          <a href="/" class="btn btn-primary">Geri Dön</a>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    
    <script>
      document
        .getElementById("plakaArama")
        .addEventListener("keyup", function () {
          let aranan = this.value.toLowerCase();
          let satirlar = document.querySelectorAll("tbody tr");

          satirlar.forEach((satir) => {
            let plaka = satir.cells[1].textContent.toLowerCase();
            if (plaka.includes(aranan)) {
              satir.scrollIntoView({ behavior: "smooth", block: "center" });
              satir.style.backgroundColor = "#fff3cd";
              setTimeout(() => {
                satir.style.backgroundColor = "";
              }, 2000);
            }
          });
        });
    </script>
  

</body></html>
